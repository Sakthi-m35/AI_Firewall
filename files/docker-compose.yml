# ============================================================
# AI-NGF — docker-compose.yml
# Full-stack deployment: API + Dashboard + Databases + Monitoring
# ============================================================
version: "3.9"

services:

  # ── AI Firewall API ────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ai_ngf_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET=${JWT_SECRET:-change-me-in-prod}
      - DB_URL=postgresql+asyncpg://ngf:${DB_PASS:-ngf123}@postgres:5432/ngf
      - MONGO_URL=mongodb://mongo:27017/ngf_logs
      - LOG_LEVEL=INFO
    volumes:
      - ./models:/app/models:ro       # pre-trained model weights (read-only)
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
    networks:
      - ngf_net
    cap_add:
      - NET_ADMIN                     # for packet capture (Scapy)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── React Dashboard ────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dashboard
    container_name: ai_ngf_dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_WS_URL=ws://localhost:8000/ws/live-traffic
    depends_on:
      - api
    networks:
      - ngf_net

  # ── PostgreSQL (policies, users, sessions) ─────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ai_ngf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ngf
      POSTGRES_USER:     ngf
      POSTGRES_PASSWORD: ${DB_PASS:-ngf123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ngf_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngf"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MongoDB (logs, threat events) ─────────────────────────
  mongo:
    image: mongo:7.0
    container_name: ai_ngf_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ngf_logs
    volumes:
      - mongo_data:/data/db
    networks:
      - ngf_net

  # ── MLflow (model tracking + registry) ────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.8.1
    container_name: ai_ngf_mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    command: >
      mlflow server
        --backend-store-uri sqlite:///mlflow.db
        --default-artifact-root /mlflow/artifacts
        --host 0.0.0.0
    volumes:
      - mlflow_data:/mlflow
    networks:
      - ngf_net

  # ── Prometheus (metrics) ───────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: ai_ngf_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - ngf_net

  # ── Grafana (dashboards) ───────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.0
    container_name: ai_ngf_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS:-admin123}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - ngf_net

volumes:
  postgres_data:
  mongo_data:
  mlflow_data:
  grafana_data:

networks:
  ngf_net:
    driver: bridge
